<title>Launch package</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  --ground:#EFF3F1; --surface:#FFFFFF; --surface-2:#F5F9F7;
  --ink:#151C19; --ink-2:#4A5852; --ink-3:#7A8880;
  --line:#D9E2DD; --line-soft:#E8EFEB;
  --accent:#0E6B4A; --accent-ink:#0B5A3E; --accent-soft:#DFEEE7;
  --yes:#1F6B4A; --yes-soft:#DEEFE5;
  --wait:#8E6113; --wait-soft:#F6EAD3;
  --no:#A2382A; --no-soft:#F6E2DE;
  --shadow:0 1px 2px rgba(21,28,25,.05), 0 8px 24px -16px rgba(21,28,25,.26);
  --sans:"Be Vietnam Pro",system-ui,-apple-system,sans-serif;
  --serif:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#101614; --surface:#19211D; --surface-2:#202A25;
  --ink:#E7EFEA; --ink-2:#A9B7B0; --ink-3:#7B8A83;
  --line:#2C3833; --line-soft:#232E29;
  --accent:#5BC793; --accent-ink:#7FD9AC; --accent-soft:#133024;
  --yes:#63C494; --yes-soft:#16332A;
  --wait:#DCA851; --wait-soft:#332918;
  --no:#E58273; --no-soft:#39201C;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -18px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --ground:#101614; --surface:#19211D; --surface-2:#202A25;
  --ink:#E7EFEA; --ink-2:#A9B7B0; --ink-3:#7B8A83;
  --line:#2C3833; --line-soft:#232E29;
  --accent:#5BC793; --accent-ink:#7FD9AC; --accent-soft:#133024;
  --yes:#63C494; --yes-soft:#16332A;
  --wait:#DCA851; --wait-soft:#332918;
  --no:#E58273; --no-soft:#39201C;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--serif);
  font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.sans{font-family:var(--sans);text-wrap:balance;margin:0}
h1{font-weight:700;font-size:clamp(1.9rem,1.2rem+2.4vw,2.7rem);line-height:1.08;letter-spacing:-.025em}
h2{font-weight:700;font-size:clamp(1.3rem,1.05rem+.8vw,1.6rem);line-height:1.2;letter-spacing:-.02em}
h3{font-weight:600;font-size:1.02rem;line-height:1.35}
p{margin:0}
a{color:var(--accent-ink);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.doc{max-width:1060px;margin:0 auto;padding-inline:clamp(16px,4vw,44px);padding-block:clamp(26px,4vw,44px) 90px}
.col{max-width:66ch}
.col > * + *{margin-top:14px}
.eyebrow{font-family:var(--mono);font-size:.68rem;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}

/* masthead */
.mast{display:flex;flex-direction:column;gap:15px;border-bottom:1px solid var(--line);padding-bottom:26px}
.mast .row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.mast .lede{font-size:1.1rem;color:var(--ink-2);max-width:60ch}
.kw{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);vertical-align:.18em;padding:0 1px}
.tools{margin-left:auto;display:flex;gap:7px}
.tools button{font-family:var(--sans);font-size:.72rem;padding:6px 11px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);border-radius:7px;cursor:pointer}
.tools button:hover{border-color:var(--accent);color:var(--accent-ink)}

.statbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-top:20px}
.sb{background:var(--surface);padding:16px 18px}
.sb .n{font-family:var(--sans);font-weight:700;font-size:1.55rem;letter-spacing:-.03em;
  line-height:1.1;font-variant-numeric:tabular-nums}
.sb .n small{font-size:.8rem;font-weight:400;color:var(--ink-3);letter-spacing:0}
.sb .l{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin-top:6px}
.sb.bad .n{color:var(--no)} .sb.good .n{color:var(--yes)}

/* tabs */
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-top:26px;position:sticky;top:0;
  background:var(--ground);z-index:20;padding-top:2px}
.tabs button{font-family:var(--sans);font-weight:600;font-size:.95rem;border:none;background:none;
  padding:13px 0;cursor:pointer;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink-2)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.panel[hidden]{display:none}

section{padding-top:46px}
.shead{display:flex;flex-direction:column;gap:5px;margin-bottom:18px;max-width:66ch}
.shead .desc{color:var(--ink-2);font-size:1rem}

/* cards */
.grid{display:grid;gap:14px;margin-top:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(248px,1fr))}
@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:20px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;min-width:0}
.card.hero{border-color:var(--accent);border-width:1.5px}
.card .nm{font-family:var(--sans);font-weight:700;font-size:1.06rem;letter-spacing:-.01em}
.card .sub{font-family:var(--mono);font-size:.69rem;color:var(--ink-3);line-height:1.5}
.card .big{font-family:var(--sans);font-weight:700;font-size:1.85rem;line-height:1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.card .big span{font-size:.75rem;font-weight:400;color:var(--ink-3);letter-spacing:0}
.card .big.none{font-size:1.15rem;color:var(--ink-3);font-weight:600}
.card p{font-size:.94rem;color:var(--ink-2)}
.card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.card li{font-family:var(--sans);font-size:.84rem;line-height:1.45;color:var(--ink-2);
  padding-left:17px;position:relative}
.card li::before{content:"";position:absolute;left:0;top:.52em;width:7px;height:7px;
  border-radius:2px;background:var(--accent);opacity:.6}
.card li b{color:var(--ink);font-weight:600}
.card ul.who{gap:0}
.card ul.who li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
  border-bottom:1px solid var(--line-soft);padding-left:0}
.card ul.who li::before{display:none}
.card ul.who li:last-child{border-bottom:0}
.card ul.who li b{font-family:var(--mono);font-size:.72rem;font-weight:500}
.card ul.who li.yes b{color:var(--yes)} .card ul.who li.nope b{color:var(--ink-3)}
.card ul.who li.part b{color:var(--wait)} .card ul.who li.unk b{color:var(--ink-3);opacity:.6}
.card ul.who li.me span{font-weight:700;color:var(--accent-ink)}
.quoteline{font-family:var(--serif);font-style:italic;color:var(--ink-2);font-size:.95rem;
  border-left:2px solid var(--line);padding-left:12px}
.srclist{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:6px 18px;box-shadow:var(--shadow);margin-top:18px}
.src{display:grid;grid-template-columns:5rem 1fr;gap:14px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.src:last-child{border-bottom:0}
.src .id{font-family:var(--mono);font-size:.7rem;color:var(--ink-3);padding-top:2px}
.src a{font-family:var(--sans);font-size:.92rem}
@media(max-width:560px){.src{grid-template-columns:1fr;gap:2px}}
.flag{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent-ink);background:var(--accent-soft);padding:3px 7px;border-radius:4px}
.flag.no{color:var(--no);background:var(--no-soft)}
.flag.wait{color:var(--wait);background:var(--wait-soft)}

/* callout */
.callout{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:2px 9px 9px 2px;padding:15px 19px;box-shadow:var(--shadow);margin-top:18px;
  font-size:.99rem;line-height:1.65}
.callout.bad{border-left-color:var(--no)} .callout.wait{border-left-color:var(--wait)}
.callout b{font-family:var(--sans);font-weight:600}
.callout .q{color:var(--ink-3);font-size:.88rem;display:block;margin-bottom:4px}

/* tables */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  box-shadow:var(--shadow);margin-top:18px}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:.86rem}
th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line-soft);vertical-align:top}
thead th{font-family:var(--mono);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;background:var(--surface-2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.k{font-family:var(--sans);font-weight:600;font-size:.84rem}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sep td{background:var(--surface-2);font-family:var(--mono);font-size:.65rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--accent-ink);padding-block:7px}
.yes{color:var(--yes)} .nope{color:var(--ink-3)} .part{color:var(--wait)} .unk{color:var(--ink-3);opacity:.6}
.tnote{font-family:var(--sans);font-size:.82rem;color:var(--ink-3);margin-top:9px}

/* bars */
.bars{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:18px clamp(15px,3vw,22px);box-shadow:var(--shadow);margin-top:18px}
.bar{display:grid;grid-template-columns:minmax(132px,1fr) minmax(0,2.4fr) 72px;gap:13px;
  align-items:center;padding:6px 0}
.bar .nm{font-family:var(--sans);font-size:.82rem;line-height:1.25}
.bar .nm small{display:block;color:var(--ink-3);font-size:.68rem;font-family:var(--mono)}
.track{height:11px;background:var(--surface-2);border-radius:3px;position:relative}
.fill{height:100%;background:var(--accent);border-radius:3px;min-width:2px}
.fill.you{background:var(--wait)}
.bar .v{font-family:var(--mono);font-size:.78rem;font-variant-numeric:tabular-nums;
  color:var(--ink-2);text-align:right}
.legend{font-family:var(--mono);font-size:.68rem;color:var(--ink-3);line-height:1.55;
  margin-top:9px;padding-top:9px;border-top:1px solid var(--line-soft)}
@media(max-width:620px){.bar{grid-template-columns:1fr 60px}.bar .track{grid-column:1/-1;order:3}}

ul.plain{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:8px}
ul.plain li{font-size:.97rem;color:var(--ink-2)}
ul.plain li b{color:var(--ink);font-family:var(--sans);font-weight:600;font-size:.92rem}

.rows{display:flex;flex-direction:column;margin-top:14px}
.row{display:grid;grid-template-columns:1.9rem 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:0}
.row .num{font-family:var(--mono);font-size:.88rem;color:var(--accent)}
.row p{font-size:.92rem;color:var(--ink-2)}
.row b{font-family:var(--sans);font-weight:600;color:var(--ink);font-size:.92rem}

.chip{display:inline-block;font-family:var(--mono);font-size:.66rem;padding:3px 7px;border-radius:20px;
  border:1px solid var(--line);color:var(--accent-ink);background:var(--surface);cursor:pointer;margin:0 3px 3px 0}
.chip:hover{border-color:var(--accent)}
pre{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:17px 19px;
  overflow:auto;font-family:var(--mono);font-size:.76rem;line-height:1.75;white-space:pre-wrap;
  word-break:break-word;margin:0;max-height:540px;box-shadow:var(--shadow)}
.atabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:18px 0 14px}
.atabs button{font-family:var(--sans);border:none;background:none;font-size:.82rem;padding:8px 11px;
  cursor:pointer;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.atabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}

.todo{list-style:none;padding:0;margin-top:14px}
.todo li{display:grid;grid-template-columns:18px 1fr;gap:12px;padding:11px 0;
  border-bottom:1px solid var(--line-soft);align-items:start}
.todo li:last-child{border-bottom:0}
.todo .box{width:15px;height:15px;border:1.5px solid var(--line);border-radius:4px;margin-top:5px}
.todo li.blk .box{border-color:var(--no);background:var(--no-soft)}
.todo .t{font-family:var(--sans);font-size:.92rem}
.todo .who{font-family:var(--mono);font-size:.66rem;color:var(--ink-3);display:block;margin-top:3px}

#drawer{position:fixed;inset:0 0 0 auto;width:min(450px,94vw);background:var(--surface);
  border-left:1px solid var(--line);box-shadow:-16px 0 46px rgba(0,0,0,.16);padding:24px 26px;
  overflow:auto;transform:translateX(101%);transition:transform .17s ease;z-index:60}
#drawer.on{transform:none}
#drawer .x{position:absolute;top:14px;right:17px;border:none;background:none;font-size:22px;
  cursor:pointer;color:var(--ink-3)}
.quote{border-left:2px solid var(--line);padding:2px 0 2px 13px;margin:11px 0;font-size:.94rem}
.quote cite{display:block;color:var(--ink-3);font:.7rem/1.5 var(--mono);font-style:normal;margin-top:5px}
footer{margin-top:54px;padding-top:18px;border-top:1px solid var(--line);font-family:var(--sans);
  font-size:.78rem;color:var(--ink-3)}
.gap{color:var(--ink-3);font-style:italic}
</style>

<div class="doc">
  <header class="mast">
    <div class="row">
      <p class="eyebrow" id="eyebrow">Launch package</p>
      <span class="tools">
        <button id="btn-theme">Theme</button>
        <button data-export="package">Download</button>
      </span>
    </div>
    <h1 id="headline"></h1>
    <p class="lede" id="lede"></p>
    <div class="statbar" id="statbar"></div>
  </header>

  <div class="tabs" role="tablist">
    <button data-tab="know" class="on">What we know</button>
    <button data-tab="do">What we do</button>
    <button data-tab="after">What happens after</button>
  </div>

  <div class="panel" id="p-know"></div>
  <div class="panel" id="p-do" hidden></div>
  <div class="panel" id="p-after" hidden></div>
  <footer id="foot"></footer>
</div>
<aside id="drawer"><button class="x" id="drawer-x" aria-label="Close">&times;</button><div id="drawer-body"></div></aside>

<script id="aris-data" type="application/json">/*__ARIS_DATA__*/</script>
<script>
const DATA = JSON.parse(document.getElementById('aris-data').textContent);
const E = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has = x => Array.isArray(x) ? x.length > 0 : (x && typeof x === 'object' ? Object.keys(x).length > 0 : x != null && x !== '');
const S = {
  state:DATA.state??{}, manifest:DATA.manifest??{}, sources:DATA.sources?.sources??[],
  category:DATA.category, pains:DATA.pains?.pains??[], personas:DATA.personas?.personas??[],
  sizing:DATA.sizing, demand:DATA.demand, positioning:DATA.positioning, messages:DATA.messages,
  gtm:DATA.gtm, claims:DATA.claims?.claims??[], verify:DATA.verify,
  metrics:DATA.metrics?.metrics??[], dashboard:DATA.dashboard, rules:DATA.playbook?.rules??[],
  assets:DATA.assets??{}, assumptions:DATA.assumptions?.assumptions??[], cuts:DATA.cutSteps?.cuts??[]
};
const srcById = new Map(S.sources.map(s=>[s.id,s]));
const painById = new Map(S.pains.map(p=>[p.id,p]));
const allMsgs = [...(S.messages?.personaMessages??[]).flatMap(pm=>(pm.messageHierarchy??[]).map(m=>({...m,personaId:pm.personaId}))),
                 ...(S.messages?.unattachedMessages??[])];
const money = o => { if(o==null) return null; if(typeof o!=='object') return E(o);
  const a=o.amount??o.value, cur=o.currency??'', u=o.unit??'';
  if(a==null) return null;
  const sym={USD:'$',EUR:'€',GBP:'£',VND:'₫'}[cur]??'';
  return `${sym}${E(a)}${sym?'':' '+E(cur)}${u?` <span>${E(u)}</span>`:''}`; };
function plain(c){ return ({
  messages_reach_a_persona:'Nothing you plan to say has a customer behind it.',
  citation_completeness:'Some claims have no source.',
  no_uncited_assertions:'Some sentences state a fact with nothing behind them.',
  no_fabricated_testimonials:'A testimonial appears that nobody real said.',
  required_disclosures_present:'Something the law expects you to state is missing.',
  no_forbidden_claims:'A claim appears that this field does not permit.',
  no_unsupported_superlatives:'A superlative appears with no evidence.',
  pricing_consistency:'Two assets quote different prices.',
  product_name_consistency:'The product name is spelled more than one way.',
  broken_links:'A link is broken or a placeholder.',
  tracking_present:'Nothing is tracked, so the launch will produce traffic nobody can attribute.',
  backward_links_resolve:'Something references evidence that does not exist.',
  every_marker_resolves:'An asset cites a claim id that does not exist.',
  every_attribute_has_evidence:'A persona has an attribute nobody actually said.'
})[c] ?? (c.replace(/_/g,' ')+'.'); }
const sec = (n,eyebrow,title,desc,body) =>
  `<section id="s${n}"><div class="shead"><p class="eyebrow">${E(n)} — ${E(eyebrow)}</p>
   <h2>${E(title)}</h2>${desc?`<p class="desc">${desc}</p>`:''}</div>${body}</section>`;

/* ================= masthead ================= */
(function mast(){
  const st=S.state, v=S.verify;
  const selDir=(S.positioning?.directions??[]).find(d=>d.id===S.positioning?.selected);
  document.getElementById('eyebrow').textContent =
    `${st.product?.name ?? 'Launch package'} · ${st.market?.category ?? 'launch package'}`;
  document.getElementById('headline').textContent =
    selDir?.name ? selDir.name : (st.product?.name ?? 'Launch package');
  // FOR / WHO / UNLIKE are scaffolding for writing the statement, not words to read.
  // Set small and quiet so the sentence reads as a sentence.
  document.getElementById('lede').innerHTML = selDir?.statement
    ? E(selDir.statement).replace(/\b(FOR|WHO|IS THE|THAT|UNLIKE|BECAUSE)\b/g,
        m => `<span class="kw">${m.toLowerCase()}</span>`)
    : '<span class="gap">No positioning selected yet. Nothing downstream means anything without it.</span>';

  const blocking=(v?.blockingIssues??[]).length;
  const price=money(S.gtm?.pricing?.recommended);
  const cited=S.claims.filter(c=>(c.sourceIds??[]).length).length;
  const validated=S.pains.filter(p=>p.status==='validated').length;
  const items=[
    [v ? (v.passed?'Ready':`${blocking}`) : '—',
     v ? (v.passed?'verification passed':'blocking issues') : 'never verified',
     v?.passed?'good':'bad'],
    [price ?? '—', 'price, recommended'],
    [`${cited}<small>/${S.claims.length}</small>`, 'claims cited'],
    S.pains.length
      ? [`${validated}<small>/${S.pains.length}</small>`, 'pains validated', validated?'':'bad']
      : ['none', 'customer research', 'bad'],
    [String((S.gtm?.channels??[]).filter(c=>c.priority==='primary').length), 'primary channels']
  ];
  document.getElementById('statbar').innerHTML = items.map(([n,l,cls])=>
    `<div class="sb ${cls??''}"><div class="n">${n}</div><div class="l">${E(l)}</div></div>`).join('');
  document.getElementById('foot').innerHTML =
    `${E(S.state.product?.name??'')} · generated ${E((DATA.generatedAt??'').slice(0,16).replace('T',' '))} · version ${E(S.manifest.version??'—')}.
     This page shows what is in <code>.aris/</code>; if the two disagree the files are right and this is stale.`;
})();

/* ================= what we know ================= */
function marketBlock(){
  const c=S.category;
  if(!c?.players?.length) return '<p class="gap">No competitors mapped yet.</p>';
  let out=`<div class="grid g3">`+c.players.map(p=>{
    const pr=(p.pricing??[])[0];
    return `<div class="card"><div class="nm">${E(p.name)}</div>
      <p class="sub">${E(p.type??'')}</p>
      ${(() => {
        // A price slot holds a price. When there is not one, say so in two words and put
        // the reason underneath, rather than squeezing a sentence into the big number.
        const m = pr ? money(pr) : null;
        if (m) return `<p class="big">${m}</p>`;
        const why = pr?.note ?? 'no price published';
        return `<p class="big none">Not published</p><p class="sub">${E(why)}</p>`;
      })()}

}
function gridBlock(){
  const fm=S.category?.featureMatrix??{}; const rows=Object.keys(fm);
  if(!rows.length) return '';
  const mine=S.state.product?.name;
  /* Inverted deliberately: a vendors-by-capabilities grid makes the reader triangulate
     between a header row and a cell. One card per capability puts the question and every
     answer to it in the same place. */
  const mark=c=>{ if(c==null) return ['unk','not checked'];
    const v=typeof c==='object'?c.value:c, st=typeof c==='object'?c.status:'unknown';
    if(v===true||v==='true'||v==='yes') return st==='unknown'?['unk','claimed, unchecked']:['yes','yes'];
    if(v===false||v==='false'||v==='no') return ['nope','no'];
    if(v==='partial') return ['part','partly'];
    return ['unk','not checked']; };
  return `<div class="grid g2">`+rows.map(r=>{
    const vendors=Object.entries(fm[r]??{});
    const yes=vendors.filter(([n,c])=>mark(c)[0]==='yes'&&n!==mine).length;
    return `<div class="card">
      <div class="nm">${E(r)}</div>
      <p class="sub">${yes===0?'No competitor has this':yes===1?'One competitor has this':`${yes} competitors have this`}</p>
      <ul class="who">`+vendors.map(([n,c])=>{ const [cls,label]=mark(c);
        return `<li class="${cls}${n===mine?' me':''}"><span>${E(n)}</span><b>${E(label)}</b></li>`; }).join('')+
      `</ul></div>`; }).join('')+`</div>`;
}

function ladderBlock(){
  const lad=S.category?.priceLadder??[];
  const per=lad.filter(x=>/per user/i.test(x.unit??'')&&Number.isFinite(Number(x.amount)));
  if(per.length<2) return '';
  const other=lad.filter(x=>!per.includes(x));
  const rec=S.gtm?.pricing?.recommended;
  const recAmt=Number.isFinite(Number(rec?.amount))&&/per user/i.test(rec?.unit??'')?Number(rec.amount):null;
  const max=Math.max(...per.map(x=>Number(x.amount)),recAmt??0);
  const all=[...per.map(x=>({n:x.player,v:Number(x.amount),c:x.currency})),
             ...(recAmt!=null?[{n:'You',v:recAmt,c:rec.currency,you:true}]:[])].sort((a,b)=>a.v-b.v);
  const sym=c=>({USD:'$',EUR:'€'}[c]??'');
  return `<div class="bars">`+all.map(x=>
    `<div class="bar"><div class="nm">${E(x.n)}${x.you?'<small>recommended</small>':''}</div>
     <div class="track"><div class="fill${x.you?' you':''}" style="width:${(x.v/max*100).toFixed(1)}%"></div></div>
     <div class="v">${sym(x.c)}${x.v}</div></div>`).join('')+
    `<p class="legend">Per user, per month, as published.${other.length?' Priced differently and not comparable on this scale: '+
      other.map(o=>`${E(o.player)} (${E(o.note??o.unit??'')})`).join(', ')+'.':''}</p></div>`;
}
function customersBlock(){

function betsBlock(){
  const rank={total:0,high:1,medium:2,low:3};
  const cost={total:'the whole package rebuilds',high:'several artifacts rebuild',
    medium:'one artifact rebuilds',low:'fix it where it sits'};
  let out=[...S.assumptions].sort((a,b)=>(rank[a.blastRadius]??9)-(rank[b.blastRadius]??9)||(a.confidence??1)-(b.confidence??1))
    .map(a=>`<div class="card"><div class="row" style="border:none;padding:0;grid-template-columns:1fr auto">
      <div class="nm" style="font-size:.98rem">${E(a.statement)}</div>

      <p>${E(a.reason??'')}</p>
      <p class="sub" style="color:var(--no)">If wrong: ${E(cost[a.blastRadius]??'unknown')}</p></div>`).join('');
  out=`<div class="grid g2">${out}</div>`;
  if(S.cuts.length) out+=`<h3 style="margin-top:26px">What this package could not know</h3>

function sourcesBlock(){
  const used=new Map(); const note=(id,w)=>{ if(!id) return; if(!used.has(id)) used.set(id,[]); used.get(id).push(w); };
  for(const p of S.pains) for(const q of p.quotes??[]) note(q.sourceId,p.id);
  for(const f of S.sizing?.factors??[]) note(f.sourceId,f.id);
  for(const s of S.demand?.signals??[]) note(s.sourceId,s.id);
  for(const c of S.claims) for(const x of c.sourceIds??[]) note(x,c.id);
  let out=`<div class="srclist">`+S.sources.map(x=>{
    const u=[...new Set(used.get(x.id)??[])];
    return `<div class="src"><div class="id">${E(x.id)}</div>
      <div><a href="${E(x.url??'#')}" target="_blank" rel="noopener">${E(x.title||x.url||'untitled')}</a>

  const t=ev.target.closest('[data-claim],[data-pain],[data-src],[data-a],[data-export]'); if(!t) return;
  if(t.dataset.claim){ev.preventDefault();showClaim(t.dataset.claim);}
  else if(t.dataset.pain){ev.preventDefault();showPain(t.dataset.pain);}
  else if(t.dataset.src){ev.preventDefault();open(`<h3>${E(t.dataset.src)}</h3>${srcLine(t.dataset.src)}`);}
  else if(t.dataset.a){ev.preventDefault();
    document.querySelectorAll('#asset-tabs button').forEach(b=>b.classList.toggle('on',b===t)); renderAsset(t.dataset.a);}
  else if(t.dataset.export){ev.preventDefault();saveJson();}
});
addEventListener('keydown',e=>{ if(e.key==='Escape') drawer.classList.remove('on'); });
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  for(const n of ['know','do','after']) document.getElementById('p-'+n).hidden=(n!==b.dataset.tab);
  scrollTo({top:0,behavior:'instant'});
});
document.getElementById('btn-theme').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':cur==='light'?'dark':(matchMedia('(prefers-color-scheme:dark)').matches?'light':'dark');
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('aris-theme',next);}catch{}
};
try{const t=localStorage.getItem('aris-theme'); if(t) document.documentElement.setAttribute('data-theme',t);}catch{}
</script>
