<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch package</title>
<style>
:root{
  --ground:#fbfcfb; --surface:#ffffff; --raise:#f3f7f4;
  --ink:#14191b; --muted:#56655f; --faint:#85938c;
  --line:#e3e8e5; --line-strong:#c9d4ce;
  --accent:#15684a; --accent-soft:#e7f1eb;
  --warn:#8a5e10; --warn-soft:#fbf3e2;
  --bad:#9e2f2f; --bad-soft:#fbeceb;
  --ok:#15684a; --ok-soft:#e7f1eb;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --measure:66ch;
  --band:#11161a; --band-ink:#dfe6e2; --band-dim:#8b9a93; --band-line:#26302c;
  --band-accent:#6fcf97; --band-bad:#f0908c;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0f1412; --surface:#151b18; --raise:#1c2420;
  --ink:#e8eeea; --muted:#9daba4; --faint:#6d7b74;
  --line:#242e29; --line-strong:#35423b;
  --accent:#6fcf97; --accent-soft:#16241d;
  --warn:#d3a355; --warn-soft:#241d10;
  --bad:#e08585; --bad-soft:#241414;
  --ok:#6fcf97; --ok-soft:#16241d;
}}
:root[data-theme="dark"]{
  --ground:#0f1412; --surface:#151b18; --raise:#1c2420;
  --ink:#e8eeea; --muted:#9daba4; --faint:#6d7b74;
  --line:#242e29; --line-strong:#35423b;
  --accent:#6fcf97; --accent-soft:#16241d;
  --warn:#d3a355; --warn-soft:#241d10;
  --bad:#e08585; --bad-soft:#241414;
  --ok:#6fcf97; --ok-soft:#16241d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
code{font-family:var(--mono);font-size:.88em;background:var(--raise);padding:1px 5px;border-radius:4px}

.wrap{max-width:940px;margin:0 auto;padding-inline:clamp(18px,4vw,40px)}

header{background:var(--band);color:var(--band-ink);border-bottom:1px solid var(--band-line)}
header .inner{padding-block:24px 0}
.mast{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.mast .mark{font:400 21px/1 var(--serif);color:var(--band-accent);letter-spacing:-.01em}
.mast .mark::after{content:"";display:inline-block;width:5px;height:5px;background:var(--band-accent);
  transform:rotate(45deg) translateY(-6px);margin-left:5px}
.mast .name{font:600 27px/1.1 var(--sans);letter-spacing:-.02em;color:#fff}
.mast .kicker{font:600 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--band-dim);align-self:center}
.toolbar{display:flex;gap:7px;margin-left:auto}
.toolbar button{font:inherit;font-size:12px;padding:6px 11px;border:1px solid var(--band-line);
  background:transparent;color:var(--band-dim);border-radius:7px;cursor:pointer}
.toolbar button:hover{border-color:var(--band-accent);color:#fff}

.stats{display:flex;gap:34px;flex-wrap:wrap;margin:22px 0 0;padding:0 0 22px}
.stat{min-width:0}
.stat .k{font:600 10px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--band-dim);display:block;margin-bottom:7px}
.stat .v{font:400 20px/1.15 var(--serif);color:#fff;display:block}
.stat .v small{font:400 13px/1 var(--sans);color:var(--band-dim);margin-left:3px}
.stat.flag .v{color:var(--band-bad)}
.stat.flag.ok .v{color:var(--band-accent)}

.tabs{display:flex;margin:0;border-top:1px solid var(--band-line)}
.tabs button{border:none;background:none;font:600 14.5px/1 var(--sans);padding:15px 0;margin-right:30px;
  cursor:pointer;color:var(--band-dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:#fff}
.tabs button.on{color:#fff;border-bottom-color:var(--band-accent)}
@media(max-width:560px){.tabs button{font-size:13px;margin-right:18px}.stats{gap:22px}}

.thesis-wrap{background:var(--surface);border-bottom:1px solid var(--line)}
.thesis-wrap .inner{padding-block:26px 30px}
.status{display:flex;gap:14px;align-items:flex-start;padding:12px 15px;border-radius:9px;
  margin:0 0 20px;border:1px solid var(--line);background:var(--raise)}
.status.blocked{background:var(--bad-soft);border-color:var(--bad)}
.status.ready{background:var(--ok-soft);border-color:var(--accent)}
.status.warn{background:var(--warn-soft);border-color:var(--warn)}
.status .mark{font:600 10.5px/1 var(--mono);letter-spacing:.1em;padding:6px 8px;border-radius:5px;
  white-space:nowrap;background:var(--surface);color:var(--muted)}
.status.blocked .mark{color:var(--bad)} .status.ready .mark{color:var(--ok)} .status.warn .mark{color:var(--warn)}
.status b{display:block;margin-bottom:2px}
.status p{margin:0;font-size:14.5px;color:var(--muted)}

.thesis{font:400 20px/1.5 var(--serif);max-width:58ch;margin:0 0 8px;letter-spacing:-.005em;text-wrap:pretty}
.thesis .k{color:var(--faint);font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;display:inline-block;transform:translateY(-3px);margin-right:1px}
.facts{display:grid;margin:22px 0 0;border-top:1px solid var(--line)}
.fact{display:grid;grid-template-columns:152px minmax(0,1fr);gap:18px;padding:10px 0;
  border-bottom:1px solid var(--line);align-items:baseline}
.fact dt{color:var(--faint);font-size:13.5px}
.fact dd{margin:0;font-size:15px}
@media(max-width:560px){.fact{grid-template-columns:1fr;gap:1px}.fact dd{padding-bottom:2px}}


.panel{padding-block:8px 88px}
.panel[hidden]{display:none}
.block{padding-block:32px;border-top:1px solid var(--line)}
.block:first-child{border-top:none}
h2{font:500 25px/1.25 var(--serif);margin:0 0 8px;letter-spacing:-.01em;text-wrap:balance}
h3{font:600 15px/1.35 var(--sans);margin:26px 0 9px}
h4{font:600 11px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:20px 0 8px}
p{margin:0 0 12px;max-width:var(--measure)}
.lede{color:var(--muted);max-width:var(--measure);margin:0 0 18px;font-size:15px}
ul,ol{max-width:var(--measure);padding-left:19px;margin:0 0 12px}
li{margin:0 0 6px}
.mono{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.tnum{font-variant-numeric:tabular-nums}
.gap{color:var(--faint);font-style:italic;font-size:14.5px;max-width:var(--measure)}

.badge{display:inline-flex;align-items:center;font:600 10px/1 var(--mono);padding:4px 6px;border-radius:4px;
  letter-spacing:.05em;text-transform:uppercase;vertical-align:1px;white-space:nowrap}
.b-verified,.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-inferred,.b-assumption{background:var(--warn-soft);color:var(--warn)}
.b-unknown{background:var(--raise);color:var(--faint)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.chip{display:inline-block;font:500 11px/1 var(--mono);padding:4px 7px;border-radius:20px;
  border:1px solid var(--line);color:var(--accent);background:var(--surface);cursor:pointer;margin:0 3px 3px 0}
.chip:hover{border-color:var(--accent)}

.copy{border-left:2px solid var(--accent);padding:1px 0 1px 15px;margin:0 0 18px;max-width:var(--measure)}
.copy .line{font:400 18px/1.45 var(--serif);margin:0 0 5px;text-wrap:pretty}
.copy .sub{color:var(--muted);font-size:14px;margin:0 0 3px}
.copy .meta{font-family:var(--mono);font-size:11px;color:var(--faint);margin:6px 0 0}
.copy .meta b{color:var(--muted)}

.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 16px;min-width:0}
.card.primary{border-color:var(--accent)}
.card h3{margin:0 0 3px;font-size:15px}
.card p{font-size:14px;margin:0 0 7px}

table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 14px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--faint);font:600 10.5px/1 var(--sans);text-transform:uppercase;letter-spacing:.07em}
.scroll{overflow-x:auto;max-width:100%;margin:0 0 14px}
table.grid th,table.grid td{text-align:center;padding:9px 10px}
table.grid th:first-child,table.grid td:first-child{text-align:left;padding-left:0;min-width:180px}
.m{display:inline-block;font-size:15px;line-height:1}
.m-y{color:var(--accent)} .m-n{color:var(--faint)} .m-p{color:var(--warn)} .m-u{color:var(--line-strong)}
.m-soft{opacity:.45}

.atabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:0 0 14px}
.atabs button{border:none;background:none;font:inherit;font-size:13px;padding:8px 10px;cursor:pointer;
  color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.atabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
pre{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:16px 18px;overflow:auto;
  font-family:var(--mono);font-size:12.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;
  margin:0;max-height:540px}

.todo{list-style:none;padding:0;max-width:var(--measure)}
.todo li{display:grid;grid-template-columns:19px minmax(0,1fr);gap:11px;padding:10px 0;
  border-bottom:1px solid var(--line);margin:0;align-items:start}
.todo .box{width:15px;height:15px;border:1.5px solid var(--line-strong);border-radius:4px;margin-top:4px}
.todo li.block{padding-block:10px;border-top:none}
.todo li.block .box{border-color:var(--bad)}
.todo .who{font-family:var(--mono);font-size:11px;color:var(--faint);display:block;margin-top:3px}

.bet{padding:15px 0;border-bottom:1px solid var(--line);max-width:var(--measure)}
.bet .top{display:flex;gap:12px;align-items:baseline;justify-content:space-between}
.bet .stmt{font-weight:600}
.conf{display:flex;align-items:center;gap:8px;white-space:nowrap}
.conf .bar{width:52px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.conf .bar i{display:block;height:100%;background:var(--warn)}
.conf .n{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.bet .why{color:var(--muted);font-size:14.5px;margin:6px 0 0}
.bet .cost{font-size:13.5px;margin:6px 0 0;color:var(--bad)}

.dash{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));margin:0 0 10px}
.metric{border:1px solid var(--line);border-radius:9px;padding:13px 14px;background:var(--surface)}
.metric .v{font:500 26px/1 var(--mono);color:var(--faint)}
.metric .l{font-size:13px;margin-top:6px}
.metric .t{font:400 11px/1 var(--mono);color:var(--faint);margin-top:4px}

.rule{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:0 9px 9px 0;
  padding:13px 16px;margin:0 0 10px;background:var(--surface);max-width:var(--measure)}
.rule .if{font-family:var(--mono);font-size:12.5px;margin:0 0 8px}
.rule .if b{color:var(--warn)}
.rule ul{margin:0;font-size:14px}

details{border-top:1px solid var(--line);padding:13px 0;max-width:100%}
summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none;display:flex;
  justify-content:space-between;align-items:center;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--mono);color:var(--faint);font-size:17px}
details[open] summary::after{content:"\2212"}
details .body{padding-top:14px}

#drawer{position:fixed;inset:0 0 0 auto;width:min(440px,94vw);background:var(--surface);
  border-left:1px solid var(--line);box-shadow:-16px 0 46px rgba(0,0,0,.14);padding:22px 24px;
  overflow:auto;transform:translateX(101%);transition:transform .17s ease;z-index:40}
#drawer.on{transform:none}
#drawer h3{margin-top:0}
#drawer .x{position:absolute;top:13px;right:16px;border:none;background:none;font-size:21px;
  cursor:pointer;color:var(--faint);line-height:1}
.quote{border-left:2px solid var(--line);padding:2px 0 2px 13px;margin:10px 0;font-size:14.5px}
.quote cite{display:block;color:var(--faint);font:11.5px/1.5 var(--mono);font-style:normal;margin-top:5px}

footer{color:var(--faint);font:12.5px/1.7 var(--mono);padding-top:22px;margin-top:10px;
  border-top:1px solid var(--line);max-width:var(--measure)}
</style>
</head>
<body>
<header>
  <div class="wrap inner">
    <div class="mast">
      <span class="mark">aris</span>
      <span class="kicker">launch package</span>
      <span class="name" id="prodname"></span>
      <span class="toolbar">
        <button id="btn-theme">Theme</button>
        <button data-export="package">Download</button>
      </span>
    </div>
    <div class="stats" id="stats"></div>
    <div class="tabs" role="tablist">
      <button data-tab="know" class="on">What we know</button>
      <button data-tab="do">What we do</button>
      <button data-tab="after">What happens after</button>
    </div>
  </div>
</header>
<div class="thesis-wrap"><div class="wrap inner" id="answer"></div></div>
<div class="wrap">
  <div class="panel" id="p-know"></div>
  <div class="panel" id="p-do" hidden></div>
  <div class="panel" id="p-after" hidden></div>
</div>
<aside id="drawer"><button class="x" id="drawer-x" aria-label="Close">&times;</button><div id="drawer-body"></div></aside>

<script id="aris-data" type="application/json">/*__ARIS_DATA__*/</script>
<script>
const DATA = JSON.parse(document.getElementById('aris-data').textContent);
const E = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has = (x) => Array.isArray(x) ? x.length > 0 : (x && typeof x === 'object' ? Object.keys(x).length > 0 : x != null && x !== '');
const S = {
  state: DATA.state ?? {}, manifest: DATA.manifest ?? {},
  sources: DATA.sources?.sources ?? [], category: DATA.category,
  pains: DATA.pains?.pains ?? [], personas: DATA.personas?.personas ?? [],
  sizing: DATA.sizing, demand: DATA.demand, positioning: DATA.positioning,
  messages: DATA.messages, gtm: DATA.gtm, claims: DATA.claims?.claims ?? [],
  verify: DATA.verify, metrics: DATA.metrics?.metrics ?? [], dashboard: DATA.dashboard,
  rules: DATA.playbook?.rules ?? [], assets: DATA.assets ?? {},
  assumptions: DATA.assumptions?.assumptions ?? [], cuts: DATA.cutSteps?.cuts ?? []
};
const srcById = new Map(S.sources.map(s => [s.id, s]));
const painById = new Map(S.pains.map(p => [p.id, p]));
const quoteById = new Map();
for (const p of S.pains) for (const q of p.quotes ?? []) quoteById.set(q.id, {...q, painId: p.id});
const allMsgs = [...(S.messages?.personaMessages ?? []).flatMap(pm =>
  (pm.messageHierarchy ?? []).map(m => ({...m, personaId: pm.personaId}))),
  ...(S.messages?.unattachedMessages ?? [])];

/**
 * Check names are written for the scripts that emit them. A reader deciding whether to
 * launch needs the consequence, not the identifier.
 */
function plain(check){
  return ({
    messages_reach_a_persona:   'Nothing you plan to say has a customer behind it.',
    citation_completeness:      'Some claims have no source.',
    no_uncited_assertions:      'Some sentences state a fact with nothing behind them.',
    no_fabricated_testimonials: 'A testimonial appears that nobody real said.',
    required_disclosures_present:'Something the law expects you to state is missing.',
    no_forbidden_claims:        'A claim appears that this field does not permit.',
    no_unsupported_superlatives:'A superlative appears with no evidence.',
    pricing_consistency:        'Two assets quote different prices.',
    product_name_consistency:   'The product name is spelled more than one way.',
    broken_links:               'A link is broken or a placeholder.',
    tracking_present:           'Nothing is tracked, so the launch will produce traffic nobody can attribute.',
    backward_links_resolve:     'Something references evidence that does not exist.',
    date_consistency:           'A date has already passed.',
    legal_links_present:        'No privacy or terms reference anywhere.',
    every_marker_resolves:      'An asset cites a claim id that does not exist.',
    every_attribute_has_evidence:'A persona has an attribute nobody actually said.',
  })[check] ?? (check.replace(/_/g, ' ') + '.');
}

function badge(st){
  const s = String(st || 'unknown').toLowerCase();
  const cls = {verified:'verified', inferred:'inferred', inferred_not_tested:'inferred',
    assumption:'assumption', unknown:'unknown', unsupported:'bad', passed:'ok', failed:'bad'}[s] || 'unknown';
  return `<span class="badge b-${cls}">${E(s === 'inferred_not_tested' ? 'inferred' : s)}</span>`;
}
const claimChip = (id) => `<span class="chip" data-claim="${E(id)}">${E(id)}</span>`;
const gap = (why) => `<p class="gap">${E(why)}</p>`;
const money = (o) => {
  if (o == null) return null;
  if (typeof o !== 'object') return E(o);
  const a = o.amount ?? o.value, cur = o.currency ?? '', unit = o.unit ?? '';
  if (a == null) return null;
  const sym = {USD:'$', EUR:'€', GBP:'£', VND:'₫'}[cur] ?? '';
  return `${sym}${E(a)}${sym ? '' : ' ' + E(cur)}${unit ? ` <span class="muted">${E(unit)}</span>` : ''}`;
};

/* ---------- 1. the answer ---------- */
function secAnswer(){
  const v = S.verify, st = S.state;
  const sel = (S.positioning?.directions ?? []).find(d => d.id === S.positioning?.selected);
  const blocking = v?.blockingIssues ?? [];
  const ready = v?.passed === true && st.status === 'launch-ready';

  let out = '';
  if (!v) {
    out += `<div class="status warn"><span class="mark">NOT CHECKED</span><div>
      <b>Nothing has been verified yet.</b><p>Run <code>/aris-verify</code> before acting on any of this.</p></div></div>`;
  } else if (!v.passed) {
    const causes = [...new Set(blocking.map(b => (b.match(/^\[([^\]]+)\]/) ?? [])[1]).filter(Boolean))];
    out += `<div class="status blocked"><span class="mark">BLOCKED</span><div>
      <b>Nothing publishes until this clears.</b>
      <p>${causes.map(c => E(plain(c))).join(' ')} See <b>Do this first</b> under What we do.</p></div></div>`;
  } else if (ready) {
    out += `<div class="status ready"><span class="mark">READY</span><div>
      <b>Every check passed.</b><p>Publishing still needs a person: <code>launchAuthorization</code> is
      ${st.launchAuthorization ? 'granted' : '<b>not granted</b>'}.</p></div></div>`;
  } else {
    out += `<div class="status ready"><span class="mark">VERIFIED</span><div>
      <b>Every check passed; the package is not assembled.</b><p>Run <code>/aris-package</code>.</p></div></div>`;
  }

  if (sel) {
    const t = sel.statement || '';
    const parts = t.split(/\b(FOR|WHO|IS THE|THAT|UNLIKE|BECAUSE)\b/);
    out += `<p class="thesis">` + (parts.length > 1
      ? parts.map(x => /^(FOR|WHO|IS THE|THAT|UNLIKE|BECAUSE)$/.test(x)
          ? `<span class="k">${E(x.toLowerCase())}</span>` : E(x)).join('')
      : E(t)) + `</p>`;
    out += `<p class="muted" style="max-width:var(--measure)">Everything below derives from this one
      sentence. Change it and the messages, the channels and the copy all change with it.</p>`;
  } else {
    out += gap('No positioning has been selected. Run /aris-position — nothing downstream means anything without it.');
  }

  return out;
}

/** The same rows, but in the tab where someone acts on them rather than in the header. */
function secGlance(){
  const st = S.state, chans = (S.gtm?.channels ?? []).filter(c => c.priority === 'primary').map(c => c.channel);
  const price = money(S.gtm?.pricing?.recommended);
  const topPain = [...S.pains].sort((a,b) => (b.frequency?.quoteCount ?? 0) - (a.frequency?.quoteCount ?? 0))[0];
  const rows = [
    ['Who it is for', E(st.market?.category ?? '')],
    ['Where', `${E((st.market?.geography ?? []).join(', '))} <span class="muted">in ${E((st.market?.language ?? []).join(', '))}</span>`],
    ['Price', price ? `${price} ${badge('inferred')} <span class="muted">recommended, not decided</span>` : '<span class="faint">not set</span>'],
    ['First channels', chans.length ? E(chans.join(' \u00b7 ')) : '<span class="faint">none chosen</span>'],
    ['Core pain', topPain ? `${E(topPain.statement)} <span class="mono faint">${topPain.frequency?.quoteCount ?? 0} quotes</span>`
      : '<span class="faint">none \u2014 no customer research was run</span>'],
    ['Out of scope', E((st.scope?.out_of_scope ?? []).join(', ')) || '<span class="faint">nothing stated</span>']
  ];
  return `<dl class="facts" style="margin-top:0;border-top:none">` + rows.map(([k, val]) =>
    `<div class="fact"><dt>${E(k)}</dt><dd>${val}</dd></div>`).join('') + `</dl>`;
}

/* ---------- 2. what we say ---------- */
function secSay(){
  const m = S.messages;
  if (!m) return gap('No messaging yet. Run /aris-messages.');
  let out = '';
  if (has(m.usp)) out += `<div class="copy"><p class="line">${E(m.usp)}</p>
    <p class="meta"><b>USP</b> · the one sentence everything else compresses to</p></div>`;
  if (has(m.valueProposition)) out += `<div class="copy"><p class="line">${E(m.valueProposition)}</p>
    <p class="meta"><b>Value proposition</b></p></div>`;

  if (allMsgs.length) {
    out += `<h3>Messages, in priority order</h3>`;
    out += `<p class="lede">Lift these directly. Each carries the evidence it rests on.</p>`;
    for (const x of allMsgs.slice().sort((a,b) => (a.priority ?? 9) - (b.priority ?? 9))) {
      const unattached = !x.personaId;
      out += `<div class="copy">
        <p class="line">${E(x.message)}</p>
        ${has(x.benefit) ? `<p class="sub">${E(x.benefit)}</p>` : ''}
        ${has(x.proof) && x.proof !== 'unknown'
          ? `<p class="sub faint">Proof: ${E(x.proof)}</p>`
          : `<p class="sub faint">Proof: ${badge('unknown')} nothing established</p>`}
        <p class="meta"><b>${E(x.id ?? '')}</b>
          ${x.cta ? ` · CTA ${E(x.cta)}` : ''}
          ${unattached ? ` · <span style="color:var(--bad)">attached to no persona</span>` : ` · ${E(x.personaId)}`}
          ${(x.evidence ?? []).map(e => ' · ' + E(e)).join('')}</p></div>`;
    }
  }
  if (has(m.elevatorPitch)) {
    out += `<h3>Said out loud</h3>`;
    for (const [k, val] of Object.entries(m.elevatorPitch))
      out += `<h4>${E(k)}</h4><p>${E(val)}</p>`;
  }
  if (has(m.featureToBenefit)) {
    out += `<h3>What each thing is for</h3><div class="scroll"><table><tbody>` +
      m.featureToBenefit.map(f => `<tr><td style="width:34%"><b>${E(f.feature ?? '')}</b></td><td>${E(f.benefit ?? '')}</td></tr>`).join('') +
      `</tbody></table></div>`;
  }
  if (has(m.tone?.avoid)) out += `<h4>Never write</h4><p class="muted">${(m.tone.avoid).map(E).join(' · ')}</p>`;
  return out;
}

/* ---------- 3. where ---------- */
function secWhere(){
  const g = S.gtm;
  if (!g) return gap('No go-to-market plan yet. Run /aris-gtm.');
  let out = '';
  const order = {primary:0, secondary:1, test:2};
  const chans = (g.channels ?? []).slice().sort((a,b) => (order[a.priority] ?? 9) - (order[b.priority] ?? 9));
  if (chans.length) {
    out += `<div class="cards">` + chans.map(c => {
      const ev = (c.audienceEvidence ?? []).length;
      return `<div class="card${c.priority === 'primary' ? ' primary' : ''}">
        <h3>${E(c.channel)}</h3>
        <p class="muted">${E(c.role ?? '')}${c.priority ? ' · ' + E(c.priority) : ''}</p>
        <h4>Why here</h4>
        <p>${(c.competitorPresence ?? []).map(E).join('; ') || '<span class="faint">no reason recorded</span>'}</p>
        <p class="mono faint">${ev ? ev + ' pieces of audience evidence' : 'no audience evidence — ' +
          (c.audienceEvidenceNote ? E(c.audienceEvidenceNote).slice(0, 90) : 'not established')}</p>
        ${c.note ? `<p class="sub faint" style="font-size:13px">${E(c.note)}</p>` : ''}</div>`;
    }).join('') + `</div>`;
  }
  if (has(g.pricing)) {
    out += `<h3>Price</h3><p style="font:400 22px/1.3 var(--serif)">${money(g.pricing.recommended) ?? 'not set'}</p>`;
    out += `<p class="muted">${badge('inferred')} A recommendation. This workflow does not decide price${
      g.pricing.confidence ? `, and confidence here is <b>${E(g.pricing.confidence)}</b>` : ''}.</p>`;
    if (has(g.pricing.basis)) out += `<h4>Why that number</h4><ul>` + g.pricing.basis.map(b => `<li>${E(b)}</li>`).join('') + `</ul>`;
  }
  if (has(g.budgetAllocation)) {
    const tot = Object.values(g.budgetAllocation).reduce((a,b) => a + (Number(b) || 0), 0);
    out += `<h3>Where the effort goes <span class="mono faint">${tot}%</span></h3><div class="scroll"><table><tbody>` +
      Object.entries(g.budgetAllocation).map(([k, val]) =>
        `<tr><td style="width:30%">${E(k)}</td><td class="tnum mono">${E(val)}%</td></tr>`).join('') + `</tbody></table></div>`;
  }
  return out;
}

/* ---------- 4. what we publish ---------- */
function secPublish(){
  const names = Object.keys(S.assets);
  if (!names.length) return gap('No assets written yet. Run /aris-assets.');
  const label = (n) => n.replace(/\.md$/, '').replace(/-/g, ' ');
  let out = `<div class="atabs" id="asset-tabs">` + names.map((n, i) =>
    `<button data-a="${E(n)}" class="${i === 0 ? 'on' : ''}">${E(label(n))}</button>`).join('') + `</div><div id="asset-body"></div>`;
  out += `<p class="lede" style="margin-top:14px">The landing page itself is not here.
    <code>landing-brief.md</code> is the copy deck; <b>pica</b> builds the page from it.</p>`;
  return out;
}
function renderAsset(name){
  const raw = S.assets[name] ?? '';
  const html = E(raw)
    .replace(/\[?(CLAIM-\d+)\]?/g, (m, id) => `<span class="chip" data-claim="${id}">${id}</span>`)
    .replace(/\[TESTIMONIAL[^\]]*\]/gi, m => `<span class="badge b-bad">${m}</span>`)
    .replace(/\[UNASSIGNED\]/g, '<span class="badge b-unknown">UNASSIGNED</span>');
  document.getElementById('asset-body').innerHTML = `<pre>${html}</pre>`;
}

/* ---------- 5. do this first ---------- */
function secDo(){
  const v = S.verify;
  const blocking = v?.blockingIssues ?? [];
  let out = '';
  if (blocking.length) {
    const byCause = new Map();
    for (const b of blocking) {
      const c = (b.match(/^\[([^\]]+)\]/) ?? [])[1] ?? 'other';
      if (!byCause.has(c)) byCause.set(c, []);
      byCause.get(c).push(b.replace(/^\[[^\]]+\]\s*/, ''));
    }
    out += `<h3>Blocking — nothing publishes until these clear</h3><ul class="todo">` +
      [...byCause.entries()].map(([c, items]) =>
        `<li class="block"><span class="box"></span><div><b>${E(plain(c))}</b>
          <div class="muted" style="font-size:14px;margin-top:3px">${E(items[0])}</div>
          ${items.length > 1 ? `<span class="who">and ${items.length - 1} more of the same</span>` : ''}</div></li>`).join('') +
      `</ul>`;
  }
  const cl = S.assets['launch-checklist.md'] ?? DATA.checklist;
  if (cl) {
    const items = String(cl).split('\n').filter(l => /^-\s*\[ \]/.test(l));
    if (items.length) {
      out += `<h3>Then, before anything is published</h3><ul class="todo">` + items.map(l => {
        const t = l.replace(/^-\s*\[ \]\s*/, '');
        const who = (t.match(/\[([A-Z]+)\]\s*$/) ?? [])[1];
        return `<li><span class="box"></span><div>${E(t.replace(/\s*-\s*\[[A-Z]+\]\s*$/, ''))}
          ${who ? `<span class="who">owner: ${E(who.toLowerCase())}</span>` : ''}</div></li>`;
      }).join('') + `</ul>`;
    }
  }
  if (!out) out = gap('No checklist yet. Run /aris-package.');
  return out;
}

/* ---------- 6. what we are betting on ---------- */
function secBets(){
  let out = `<p class="lede">Every one of these could be wrong. They are ordered by what it costs if they are.</p>`;
  const rank = {total:0, high:1, medium:2, low:3};
  const sorted = [...S.assumptions].sort((a,b) =>
    (rank[a.blastRadius] ?? 9) - (rank[b.blastRadius] ?? 9) || (a.confidence ?? 1) - (b.confidence ?? 1));
  for (const a of sorted) {
    const pct = Math.round((a.confidence ?? 0) * 100);
    out += `<div class="bet">
      <div class="top"><span class="stmt">${E(a.statement)}</span>
        <span class="conf"><span class="bar"><i style="width:${pct}%"></i></span>
        <span class="n tnum">${pct}%</span></span></div>
      ${a.reason ? `<p class="why">${E(a.reason)}</p>` : ''}
      <p class="cost">If wrong: ${E({total:'the whole package rebuilds',high:'several artifacts rebuild',
        medium:'one artifact rebuilds',low:'fix it where it sits'}[a.blastRadius] ?? 'unknown')}
        ${(a.producedArtifacts ?? []).length ? `<span class="mono faint"> · ${(a.producedArtifacts).map(E).join(', ')}</span>` : ''}</p>
    </div>`;
  }
  if (S.cuts.length) {
    out += `<h3>What this package could not know</h3>
      <p class="lede">Deliberate omissions, not oversights. They are why some of the bets above are bets.</p>
      <div class="scroll"><table><thead><tr><th>Not done</th><th>Consequence</th><th>Risk</th></tr></thead><tbody>` +
      S.cuts.map(c => `<tr><td class="mono" style="width:22%">${E(c.deleted)}</td><td>${E(c.consequence)}</td>
        <td><span class="badge b-${c.risk === 'high' ? 'bad' : c.risk === 'medium' ? 'inferred' : 'unknown'}">${E(c.risk ?? '')}</span></td></tr>`).join('') +
      `</tbody></table></div>`;
  }
  return out;
}

/* ---------- 7. after launch ---------- */
function secAfter(){
  if (!S.metrics.length && !S.rules.length) return gap('No measurement plan yet. Run /aris-harness and /aris-playbook.');
  let out = '';
  if (S.metrics.length) {
    out += `<h3>What to watch</h3>
      <p class="lede">Empty on purpose. A chart with plausible numbers before launch is the clearest way to
      mislead yourself, so nothing is drawn until a real export lands in
      <code>.aris/evidence/analytics/</code>.</p>`;
    const secs = S.dashboard?.sections ?? [{name:'Metrics', metrics: S.metrics.map(m => m.name)}];
    for (const s of secs) {
      out += `<h4>${E(s.name)}</h4><div class="dash">` + (s.metrics ?? []).map(mn => {
        const m = S.metrics.find(x => x.name === mn || x.id === mn) ?? {name: mn};
        return `<div class="metric"><div class="v">—</div><div class="l">${E(m.name ?? mn)}</div>
          <div class="t">${m.target != null ? 'target ' + E(m.target) : 'no target set'}</div></div>`;
      }).join('') + `</div>`;
    }
    const defined = S.metrics.filter(m => has(m.definition));
    if (defined.length) {
      out += `<details><summary>How each is counted</summary><div class="body"><div class="scroll"><table><tbody>` +
        defined.map(m => `<tr><td style="width:30%"><b>${E(m.name)}</b></td><td>${E(m.definition)}
          <div class="mono faint">${E(m.formula ?? '')}</div></td></tr>`).join('') + `</tbody></table></div></div></details>`;
    }
  }
  if (S.rules.length) {
    out += `<h3>Decided in advance</h3>
      <p class="lede">Written now, while nobody is defending a result. A rule written after the data arrives
      is a rationalisation of whatever happened.</p>`;
    for (const r of S.rules) {
      out += `<div class="rule">
        <p class="if"><b>IF</b> ${E(r.metric)} ${E(r.condition)}
          ${r.threshold == null ? `<span class="badge b-unknown">threshold unset</span>` : `<b>${E(r.threshold)}</b>`}
          ${r.window ? `for ${E(r.window)}` : ''}</p>
        <ul>${(r.action ?? []).map(a => `<li>${E(a)}</li>`).join('')}</ul></div>`;
    }
  }
  return out;
}

/**
 * The price ladder, drawn.
 *
 * Only per-user-per-month prices are plotted. Bitrix24 charges per organisation and
 * Zoho One per employee on payroll; putting them on the same axis would compare
 * numbers that do not mean the same thing, so they are listed beside it instead.
 */
function priceLadder(){
  const lad = S.category?.priceLadder ?? [];
  if (!lad.length) return '';
  const per = lad.filter(x => /per user/i.test(x.unit ?? '') && Number.isFinite(Number(x.amount)));
  const other = lad.filter(x => !per.includes(x));
  if (per.length < 2) return '';
  const rec = S.gtm?.pricing?.recommended;
  const recAmt = Number.isFinite(Number(rec?.amount)) && /per user/i.test(rec?.unit ?? '') ? Number(rec.amount) : null;
  const vals = per.map(x => Number(x.amount)).concat(recAmt ?? []);
  const lo = 0, hi = Math.ceil(Math.max(...vals) * 1.12);
  const W = 640, H = 34 + per.length * 26 + 22, PAD = 112;
  const x = (v) => PAD + (v - lo) / (hi - lo) * (W - PAD - 26);

  let g = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;height:auto" role="img"
    aria-label="Published prices per user per month">`;
  for (const t of [0, hi/4, hi/2, hi*3/4, hi]) {
    g += `<line x1="${x(t).toFixed(1)}" y1="26" x2="${x(t).toFixed(1)}" y2="${H-26}" stroke="var(--line)"/>`;
    g += `<text x="${x(t).toFixed(1)}" y="18" text-anchor="middle" font-family="var(--mono)" font-size="10.5"
      fill="var(--faint)">${t === 0 ? '0' : Math.round(t)}</text>`;
  }
  if (recAmt != null) {
    g += `<rect x="${x(recAmt).toFixed(1)}" y="26" width="2" height="${H-52}" fill="var(--accent)"/>`;
    g += `<text x="${x(recAmt).toFixed(1)}" y="${H-10}" text-anchor="middle" font-family="var(--mono)"
      font-size="10.5" font-weight="600" fill="var(--accent)">you · ${recAmt}</text>`;
  }
  per.slice().sort((a,b) => Number(a.amount) - Number(b.amount)).forEach((it, i) => {
    const y = 40 + i * 26;
    g += `<text x="${PAD - 12}" y="${y + 4}" text-anchor="end" font-size="12.5" fill="var(--ink)">${E(it.player)}</text>`;
    g += `<line x1="${PAD}" y1="${y}" x2="${x(Number(it.amount)).toFixed(1)}" y2="${y}" stroke="var(--line-strong)"/>`;
    g += `<circle cx="${x(Number(it.amount)).toFixed(1)}" cy="${y}" r="4.5" fill="var(--ink)"/>`;
    g += `<text x="${(x(Number(it.amount)) + 11).toFixed(1)}" y="${y + 4}" font-family="var(--mono)"
      font-size="11" fill="var(--muted)">${E(it.currency === 'EUR' ? '€' : '$')}${E(it.amount)}</text>`;
  });
  g += `</svg>`;
  let out = `<h3>What the field charges</h3>
    <p class="lede">Per user, per month, as published. ${recAmt != null
      ? 'The green line is the recommendation.' : ''}</p>${g}`;
  if (other.length) out += `<p class="muted" style="font-size:14px">Priced differently, so not on the
    same axis: ` + other.map(o => `<b>${E(o.player)}</b> ${o.amount != null
      ? E((o.currency === 'EUR' ? '€' : '$') + o.amount) + ' ' + E(o.unit ?? '') : E(o.note ?? 'not published')}`).join('; ') + `.</p>`;
  return out;
}

/** The feature matrix as a grid of marks, not prose in table cells. */
function featureGrid(){
  const fm = S.category?.featureMatrix ?? {};
  const rows = Object.keys(fm);
  if (!rows.length) return '';
  const cols = [...new Set(rows.flatMap(r => Object.keys(fm[r] ?? {})))];
  const cell = (c) => {
    if (c == null) return `<span class="m m-u">?</span>`;
    const v = typeof c === 'object' ? c.value : c;
    const st = typeof c === 'object' ? c.status : 'unknown';
    if (v === true || v === 'true' || v === 'yes') return `<span class="m m-y${st === 'unknown' ? ' m-soft' : ''}">●</span>`;
    if (v === false || v === 'false' || v === 'no') return `<span class="m m-n">—</span>`;
    if (v === 'partial') return `<span class="m m-p">◐</span>`;
    return `<span class="m m-u">?</span>`;
  };
  let out = `<h3>Who has what</h3><p class="lede">Filled from their own pages.
    <span class="m m-y">●</span> has it · <span class="m m-n">—</span> does not ·
    <span class="m m-p">◐</span> partly · <span class="m m-u">?</span> nobody has checked.</p>`;
  out += `<div class="scroll"><table class="grid"><thead><tr><th></th>` +
    cols.map(c => `<th>${E(c)}</th>`).join('') + `</tr></thead><tbody>` +
    rows.map(r => `<tr><td>${E(r)}</td>` + cols.map(c => `<td>${cell(fm[r]?.[c])}</td>`).join('') + `</tr>`).join('') +
    `</tbody></table></div>`;
  return out;
}

/* ---------- what we know ---------- */
function secMarket(){
  const c = S.category;
  if (!c?.players?.length) return gap('No competitors mapped yet. Run /aris-category.');
  let out = `<p class="lede">Read off their own pages, not from reviews. Prices are what they publish.</p>`;
  out += `<div class="scroll"><table><thead><tr><th style="width:16%">Who</th><th style="width:26%">What they say</th><th style="width:16%">Price</th><th>Where they are weak</th></tr></thead><tbody>` +
    c.players.map(pl => {
      const pr = (pl.pricing ?? [])[0];
      return `<tr><td style="min-width:130px"><b>${E(pl.name)}</b><div class="faint" style="font-size:12px">${E(pl.type ?? '')}</div></td>
        <td>${E((pl.positioning ?? [])[0] ?? '')}</td>
        <td class="tnum">${pr ? (money(pr) ?? `<span class="faint">${E(pr.note ?? 'not published')}</span>`) : '<span class="faint">unknown</span>'}</td>
        <td>${(pl.weaknesses ?? []).slice(0,2).map(E).join('; ')}</td></tr>`;
    }).join('') + `</tbody></table></div>`;
  out += featureGrid() + priceLadder();
  if (has(c.marketGaps)) out += `<h3>The gaps we found</h3><ul>` + c.marketGaps.map(g =>
    `<li>${E(typeof g === 'object' ? g.value : g)} ${typeof g === 'object'
      ? (g.sourceIds ?? []).map(id => `<span class="chip" data-src="${E(id)}">${E(id)}</span>`).join('') : ''}</li>`).join('') + `</ul>`;
  return out;
}
function secCustomers(){
  if (!S.pains.length) return `<div class="status blocked"><span class="mark">NOTHING</span><div>
    <b>No customer was asked anything.</b>
    <p>No voice-of-customer research was run, so nothing here has a quote behind it and no persona was
    built. Everything under <b>What we do</b> rests on what competitors fail to sell, which is not the
    same as what buyers want.</p></div></div>`;
  let out = `<p class="lede">Ranked by how many separate people said it. Click one to read their words.</p>`;
  out += `<div class="scroll"><table><thead><tr><th>What they said</th><th>People</th><th>Places</th><th></th></tr></thead><tbody>` +
    [...S.pains].sort((a,b)=>(b.frequency?.quoteCount??0)-(a.frequency?.quoteCount??0)).map(pn =>
      `<tr><td><a href="#" data-pain="${E(pn.id)}">${E(pn.statement)}</a></td>
       <td class="tnum mono">${pn.frequency?.quoteCount ?? 0}</td>
       <td class="tnum mono">${pn.frequency?.sourceCount ?? 0}</td>
       <td>${pn.status === 'validated' ? badge('verified') : badge('unknown')}</td></tr>`).join('') + `</tbody></table></div>`;
  if (S.personas.length) out += `<h3>Who they are</h3><div class="cards">` + S.personas.map(pe =>
    `<div class="card"><h3>${E(pe.name || pe.id)}</h3><p class="muted">${E(pe.jobToBeDone ?? '')}</p>
     ${(pe.attributes ?? []).slice(0,4).map(a => `<p style="font-size:14px">${E(a.attribute)}
       ${(a.evidence ?? []).map(id => `<span class="chip" data-quote="${E(id)}">${E(id)}</span>`).join('')}</p>`).join('')}</div>`).join('') + `</div>`;
  return out;
}
function secSize(){
  let out = '';
  if (S.sizing) {
    out += `<p class="lede">Built up from public counts. Ranges, not points, because the weakest factor sets the width.</p>`;
    for (const k of ['tam','sam','som']) {
      const calc = S.sizing.calculations?.[k], r = calc?.range;
      out += `<p><b>${k.toUpperCase()}</b> <span class="tnum">${Array.isArray(r)
        ? `${Number(r[0]).toLocaleString()} – ${Number(r[1]).toLocaleString()}` : '—'}</span>
        <span class="mono faint">${E(calc?.formula ?? '')}</span> ${badge('inferred')}</p>`;
    }
    if (has(S.sizing.limitations)) out += `<h4>Where it is weakest</h4><ul>` +
      S.sizing.limitations.map(l => `<li>${E(l)}</li>`).join('') + `</ul>`;
  } else out += gap('Not sized. Run /aris-size.');
  if (S.demand) {
    out += `<h3>Whether anyone wants it</h3>
      <div class="status warn"><span class="mark">GUESSED</span><div><b>Read off public pages, never tested.</b>
      <p>Nobody was asked whether they would pay.</p></div></div>`;
    for (const sg of S.demand.signals ?? []) {
      const v = sg.value && typeof sg.value === 'object'
        ? Object.entries(sg.value).map(([k,x]) => `${k}: ${x}`).join(', ') : sg.value;
      out += `<p><b>${E(String(sg.type ?? '').replace(/_/g,' '))}</b> ${E(v ?? '—')}
        <span class="chip" data-src="${E(sg.sourceId ?? '')}">${E(sg.sourceId ?? '')}</span></p>`;
    }
    const dnp = S.demand.doesNotProve ?? [];
    if (dnp.length) out += `<h4>What this does not prove</h4><p class="muted">${dnp.map(E).join(' · ')}</p>`;
  }
  return out;
}
function secSources(){
  const used = new Map();
  const note = (id, what) => { if (!id) return; if (!used.has(id)) used.set(id, []); used.get(id).push(what); };
  for (const pn of S.pains) for (const q of pn.quotes ?? []) note(q.sourceId, pn.id);
  for (const f of S.sizing?.factors ?? []) note(f.sourceId, f.id);
  for (const sg of S.demand?.signals ?? []) note(sg.sourceId, sg.id);
  for (const cl of S.claims) for (const x of cl.sourceIds ?? []) note(x, cl.id);
  let out = `<details><summary>Every source we read <span class="mono faint">${S.sources.length}</span></summary><div class="body">
    <div class="scroll"><table><tbody>` + S.sources.map(x => {
      const u = [...new Set(used.get(x.id) ?? [])];
      return `<tr><td class="mono" style="width:11%">${E(x.id)}</td>
        <td>${x.url ? `<a href="${E(x.url)}" target="_blank" rel="noopener">${E(x.title || x.url)}</a>` : E(x.title ?? '')}
          <div class="mono faint">${E(x.publisher ?? '')} · ${E(x.accessedAt ?? '')}</div></td>
        <td style="width:22%">${u.length ? u.map(y => `<span class="mono faint">${E(y)}</span>`).join(' ') : '<span class="badge b-unknown">unused</span>'}</td></tr>`;
    }).join('') + `</tbody></table></div>`;
  if (has(DATA.sources?.gaps)) out += `<h4>What we could not read</h4><ul>` +
    DATA.sources.gaps.map(g => `<li>${E(g)}</li>`).join('') + `</ul>`;
  return out + `</div></details>`;
}
function secWhyThis(){
  const pg = S.positioning;
  if (!pg) return gap('No positioning yet.');
  const sel = (pg.directions ?? []).find(d => d.id === pg.selected);
  let out = '';
  if (sel && has(sel.whitespace)) out += `<ul>` + sel.whitespace.map(w => `<li>${E(w)}</li>`).join('') + `</ul>`;
  const rej = new Map((pg.rejected ?? []).map(r => [r.id, r.reason]));
  const others = (pg.directions ?? []).filter(d => d.id !== pg.selected);
  if (others.length) out += `<details><summary>What we decided against <span class="mono faint">${others.length}</span></summary><div class="body">` +
    others.map(d => `<p><b>${E(d.name ?? d.id)}</b><br><span class="muted">${E(d.statement ?? '')}</span><br>
      <span style="color:var(--bad)">Why not: ${E(rej.get(d.id) ?? 'no reason recorded')}</span></p>`).join('') + `</div></details>`;
  return out;
}

const block = (title, fn) => {
  let body;
  try { body = fn(); } catch (e) { body = `<div class="status blocked"><span class="mark">ERROR</span>
    <div><b>This part could not render.</b><p>${E(e.message)}</p></div></div>`; }
  return `<div class="block"><h2>${E(title)}</h2>${body}</div>`;
};

document.getElementById('prodname').textContent = S.state.product?.name || '';
document.getElementById('answer').innerHTML = secAnswer();

(function stats(){
  const v = S.verify, st = S.state;
  const price = money(S.gtm?.pricing?.recommended);
  const chans = (S.gtm?.channels ?? []).filter(c => c.priority === 'primary').length;
  const blocking = (v?.blockingIssues ?? []).length;
  const cited = S.claims.filter(c => (c.sourceIds ?? []).length).length;
  const ready = v?.passed === true;
  const items = [
    ['Status', ready ? 'Ready' : v ? `${blocking} blocking` : 'Not checked', 'flag' + (ready ? ' ok' : '')],
    ['Market', `${E((st.market?.geography ?? []).join(', '))}<small>${E((st.market?.language ?? []).join('/'))}</small>`],
    ['Price', price ? price.replace('<span class="muted">', '<small>').replace('</span>', '</small>') : 'not set'],
    ['Claims cited', `${cited}/${S.claims.length}`],
    ['Channels', String(chans)]
  ];
  document.getElementById('stats').innerHTML = items.map(([k, val, cls]) =>
    `<div class="stat ${cls ?? ''}"><span class="k">${E(k)}</span><span class="v">${val}</span></div>`).join('');
})();
document.getElementById('p-know').innerHTML =
  block('Who else is here', secMarket) + block('What customers told us', secCustomers) +
  block('How big it is', secSize) + block('What we are not sure about', secBets) +
  block('Where it all came from', secSources);
document.getElementById('p-do').innerHTML =
  block('At a glance', secGlance) +
  block('Why this position', secWhyThis) + block('What we say', secSay) +
  block('Where we say it', secWhere) + block('What we publish', secPublish) +
  block('Do this first', secDo);
document.getElementById('p-after').innerHTML = block('After it launches', secAfter) +
  `<footer>${E(S.state.product?.name ?? '')} · generated ${E((DATA.generatedAt ?? '').slice(0,16).replace('T',' '))}
   · version ${E(S.manifest.version ?? '—')}<br>
   This page shows what is in <code>.aris/</code>. If the two disagree, the files are right and this is stale.</footer>`;

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  for (const nm of ['know','do','after']) document.getElementById('p-' + nm).hidden = (nm !== b.dataset.tab);
  scrollTo({top:0, behavior:'instant'});

if (Object.keys(S.assets).length) renderAsset(Object.keys(S.assets)[0]);

/* ---------- drawer ---------- */
const drawer = document.getElementById('drawer'), dbody = document.getElementById('drawer-body');
const openDrawer = (h) => { dbody.innerHTML = h; drawer.classList.add('on'); };
document.getElementById('drawer-x').onclick = () => drawer.classList.remove('on');
function srcLine(id){
  const s = srcById.get(id);
  if (!s) return `<p class="mono">${E(id)} <span class="badge b-bad">missing</span></p>`;
  return `<p style="margin:8px 0"><a href="${E(s.url ?? '#')}" target="_blank" rel="noopener">${E(s.title || s.url || id)}</a>
    <span class="mono faint" style="display:block">${E(id)} · ${E(s.publisher ?? '')} · ${E(s.accessedAt ?? '')}</span></p>`;
}
function showClaim(id){
  const c = S.claims.find(x => x.id === id);
  if (!c) return openDrawer(`<h3>${E(id)}</h3><p class="gap">Not in the registry. This marker resolves to nothing.</p>`);
  let h = `<h3>${E(c.id)} ${badge(c.status)}</h3><p style="font:400 17px/1.5 var(--serif)">${E(c.text)}</p>`;
  h += `<p class="mono faint">${E(c.type ?? '')} · used in ${(c.usedIn ?? []).map(x => E(x.split('/').pop())).join(', ') || 'nothing'}</p>`;
  const m = allMsgs.find(x => x.id === c.messageId);
  if (m) h += `<h4>Serves the message</h4><p>${E(m.message)}</p>`;
  for (const e of m?.evidence ?? []) {
    const p = painById.get(e);
    if (p) {
      h += `<h4>Which answers</h4><p>${E(p.statement)} <span class="mono faint">${p.frequency?.quoteCount ?? 0} quotes</span></p>`;
      h += (p.quotes ?? []).slice(0,3).map(q => `<div class="quote">${E(q.text)}<cite>${E(q.id)} ·
        ${q.url ? `<a href="${E(q.url)}" target="_blank" rel="noopener">${E(q.platform || 'source')}</a>` : E(q.platform ?? '')}</cite></div>`).join('');
    }
  }
  h += `<h4>Sources</h4>${(c.sourceIds ?? []).length ? c.sourceIds.map(srcLine).join('')
    : `<p class="gap">No source. This claim blocks the launch.</p>`}`;
  openDrawer(h);
}
function showPain(id){
  const p = painById.get(id);
  if (!p) return openDrawer(`<h3>${E(id)}</h3><p class="gap">No such pain.</p>`);
  openDrawer(`<h3>${E(p.id)} ${p.status === 'validated' ? badge('verified') : badge('unknown')}</h3>
    <p style="font:400 17px/1.5 var(--serif)">${E(p.statement)}</p>
    <p class="mono faint">${p.frequency?.quoteCount ?? 0} quotes · ${p.frequency?.sourceCount ?? 0} sources</p>
    ${(p.quotes ?? []).map(q => `<div class="quote">${E(q.text)}<cite>${E(q.id)} ·
      ${q.url ? `<a href="${E(q.url)}" target="_blank" rel="noopener">${E(q.platform || 'source')}</a>` : E(q.platform ?? '')}
      · ${E(q.date ?? '')}</cite></div>`).join('') || '<p class="gap">No quotes stored.</p>'}`);
}
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-claim],[data-pain],[data-src],[data-a],[data-export]');
  if (!t) return;
  if (t.dataset.claim) { ev.preventDefault(); showClaim(t.dataset.claim); }
  else if (t.dataset.pain) { ev.preventDefault(); showPain(t.dataset.pain); }
  else if (t.dataset.src) { ev.preventDefault(); openDrawer(`<h3>${E(t.dataset.src)}</h3>${srcLine(t.dataset.src)}`); }
  else if (t.dataset.a) { ev.preventDefault();
    document.querySelectorAll('#asset-tabs button').forEach(b => b.classList.toggle('on', b === t));
    renderAsset(t.dataset.a); }
  else if (t.dataset.export) { ev.preventDefault(); saveJson(); }
});
addEventListener('keydown', e => { if (e.key === 'Escape') drawer.classList.remove('on'); });

/**
 * Saving the data works two ways, because this page has two homes.
 *
 * Opened from disk it is a plain file, and an <a download> is the only route. Published
 * as an Artifact the viewer sandbox ignores that link entirely, and the `downloads`
 * capability is what actually hands someone a file. Try the capability first, fall back
 * to the link, and if neither is available hide the button rather than leave a control
 * that silently does nothing.
 */
let downloadsApi = null;
(async () => {
  if (!window.claude?.use) return;                 // opened from disk: the link works
  try { downloadsApi = await window.claude.use('downloads'); } catch { downloadsApi = null; }
  if (!downloadsApi) document.querySelector('[data-export]')?.remove();
})();

async function saveJson(){
  const name = `aris-${(S.state.product?.name || 'package').toLowerCase().replace(/\W+/g,'-')}.json`;
  const data = JSON.stringify(DATA, null, 2);
  if (downloadsApi) {
    try { await downloadsApi.save({ filename: name, data }); } catch { /* viewer declined */ }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type:'application/json'}));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

document.getElementById('btn-theme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : cur === 'light' ? 'dark'
    : (matchMedia('(prefers-color-scheme:dark)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('aris-theme', next); } catch {}
};
try { const t = localStorage.getItem('aris-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch {}
