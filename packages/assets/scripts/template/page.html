<!--
  Markup only. The stylesheet is page.css and the behaviour is page.js; build-html.mjs
  assembles all three, so edit the file that owns the thing you are changing.

  They were one 44 KB file until two edits in one session broke it: a splice removed the
  entire stylesheet, and a duplicate rule painted the active tab dark on a dark ground.
  Both were the kind of mistake you only make in a file too large to see at once.

  The two upper-case slots below are filled at build time. Do not name them anywhere
  else in this file: the substitution takes the first occurrence it finds.
-->
<title>Launch package</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Literata:opsz,wght@7..72,400;7..72,600&family=Source+Sans+3:wght@400;600;700&display=swap">
__ARIS_STYLE__
<div class="doc">
  <header class="mast">
    <div class="row">
      <p class="eyebrow" id="eyebrow">Launch package</p>
      <span class="tools">
        <button id="btn-theme">Theme</button>
        <button data-export="package">Download</button>
      </span>
    </div>
    <h1 id="headline"></h1>
    <p class="lede" id="lede"></p>
    <div class="statbar" id="statbar"></div>
  </header>

  <div class="tabs" role="tablist">
    <button data-tab="know" class="on">What we know</button>
    <button data-tab="do">What we do</button>
    <button data-tab="after">What happens after</button>
  </div>

  <div class="panel" id="p-know"></div>
  <div class="panel" id="p-do" hidden></div>
  <div class="panel" id="p-after" hidden></div>
  <footer id="foot"></footer>
</div>
<aside id="drawer"><button class="x" id="drawer-x" aria-label="Close">&times;</button><div id="drawer-body"></div></aside>
<script id="aris-data" type="application/json">/*__ARIS_DATA__*/</script>
__ARIS_SCRIPT__
