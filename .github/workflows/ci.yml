name: gates

# The gates are the product. A change that breaks one has to fail here, because the
# alternative is finding out on someone's launch.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20.x", "22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: every script parses
        run: |
          for f in $(find packages -name '*.mjs'); do node --check "$f"; done
          node --check packages/core/hooks/gate-publish
          node --check packages/core/hooks/session-start
          node --check packages/assets/scripts/template/page.js

      - name: every manifest is valid JSON
        run: |
          for f in .claude-plugin/marketplace.json packages/*/.claude-plugin/plugin.json packages/core/hooks/hooks.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1
          done

      - name: every sector entry is valid JSON and resolves
        run: |
          for f in packages/core/data/sectors/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1
          done
          node packages/core/scripts/sector-check.mjs --list > /dev/null

      - name: the gate harness
        run: node test/run.mjs

      # The README is the first thing a stranger reads, and its test badge sat at 88
      # while the suite had grown past 150. A number nobody checks is a number that rots.
      - name: the README test count matches the suite
        run: |
          N=$(node test/run.mjs | grep -oE "[0-9]+ passed" | grep -oE "[0-9]+")
          echo "suite reports $N passed"
          grep -q "tests-$N-" README.md || { echo "::error::README badge does not say $N tests"; exit 1; }
          grep -q "$N cases" README.md || { echo "::error::README prose does not say $N cases"; exit 1; }

      # claude plugin update is version-keyed, so a behaviour change that does not move
      # the version reaches nobody however green this run is. Two merged PRs shipped to
      # an install still sitting on 0.1.0 before this step existed.
      - name: version-bump guard, a packages change must move the version
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch -q origin "${{ github.base_ref }}"
          if [ -n "$(git diff --name-only "$BASE...HEAD" -- packages/)" ]; then
            if [ -z "$(git diff "$BASE...HEAD" -- 'packages/*/.claude-plugin/plugin.json' | grep "^+.*\"version\"")" ]; then
              echo "::error::packages/ changed but no plugin.json version moved. Users update by version, so this change would reach nobody."
              exit 1
            fi
            echo "packages/ changed and a version moved"
          else
            echo "no packages/ change, nothing to assert"
          fi
