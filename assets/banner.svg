<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img"
     aria-label="aris — from an unknown market to a launch you can defend">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#0c0e13"/>
      <stop offset="0.55" stop-color="#101520"/>
      <stop offset="1"   stop-color="#0d1118"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#5ec48a" stop-opacity="0.15"/>
      <stop offset="0.5"  stop-color="#5ec48a" stop-opacity="0.55"/>
      <stop offset="1"    stop-color="#5ec48a" stop-opacity="0.15"/>
    </linearGradient>
    <style>
      .serif  { font-family: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif; }
      .sans   { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif; }
      .mono   { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; }
      .chain  { font-size: 17px; letter-spacing: .15em; fill: #6b7689; }
      .stage  { font-size: 25px; fill: #ccd4e0; }
      .stats  { font-size: 22px; fill: #66718a; }
    </style>
  </defs>

  <rect width="1600" height="600" rx="30" fill="url(#card)"/>
  <rect x="0.5" y="0.5" width="1599" height="599" rx="29.5" fill="none" stroke="#1d2431"/>

  <!-- the traceability spine: aris's signature, and the thing every check enforces -->
  <g class="mono chain" text-anchor="middle">
    <text x="112"  y="76">SOURCE</text>
    <text x="311"  y="76">QUOTE</text>
    <text x="510"  y="76">PAIN</text>
    <text x="709"  y="76">PERSONA</text>
    <text x="908"  y="76">POSITION</text>
    <text x="1107" y="76">MESSAGE</text>
    <text x="1306" y="76">CLAIM</text>
    <text x="1495" y="76">VERIFIED</text>
  </g>
  <line x1="112" y1="96" x2="1495" y2="96" stroke="url(#fade)" stroke-width="1.25"/>
  <g fill="#2a3446">
    <circle cx="112"  cy="96" r="3.4"/><circle cx="311"  cy="96" r="3.4"/>
    <circle cx="510"  cy="96" r="3.4"/><circle cx="709"  cy="96" r="3.4"/>
    <circle cx="908"  cy="96" r="3.4"/><circle cx="1107" cy="96" r="3.4"/>
    <circle cx="1306" cy="96" r="3.4"/>
  </g>
  <circle cx="1495" cy="96" r="5" fill="#5ec48a"/>

  <!-- wordmark -->
  <text x="100" y="330" class="serif" font-size="178" fill="#f2f5f8" letter-spacing="-2">aris</text>

  <!-- tagline -->
  <g text-anchor="end">
    <text x="1500" y="246" class="sans" font-size="35" font-weight="600" fill="#eef2f7">From an unknown market to a launch you can defend.</text>
    <text x="1500" y="294" class="sans" font-size="27" fill="#8b95a6">Every claim traces back to a source you can open.</text>
    <text x="1500" y="330" class="sans" font-size="27" fill="#8b95a6">Never a number nobody can check.</text>
  </g>

  <line x1="100" y1="392" x2="1500" y2="392" stroke="#1e2532"/>

  <!-- the chain, as stages -->
  <g class="sans stage" text-anchor="middle">
    <text x="150"  y="452">research</text>
    <text x="418"  y="452">validate</text>
    <text x="686"  y="452">position</text>
    <text x="954"  y="452">message</text>
    <text x="1222" y="452">plan</text>
    <text x="1462" y="452">package</text>
  </g>
  <line x1="150" y1="488" x2="1462" y2="488" stroke="#222a39" stroke-width="1.25"/>
  <g fill="none" stroke="#5ec48a" stroke-width="1.6">
    <circle cx="150"  cy="488" r="7"/>
    <circle cx="418"  cy="488" r="7"/>
    <circle cx="954"  cy="488" r="7"/>
    <circle cx="1462" cy="488" r="7"/>
  </g>
  <!-- diamonds: the two points where a person decides -->
  <path d="M 686 478 l 10 10 -10 10 -10 -10 z"  fill="#5ec48a"/>
  <path d="M 1222 478 l 10 10 -10 10 -10 -10 z" fill="#5ec48a"/>
  <g class="mono" font-size="17" fill="#5ec48a" text-anchor="middle" letter-spacing=".09em">
    <text x="686"  y="522">you choose</text>
    <text x="1222" y="522">you choose</text>
  </g>

  <text x="100" y="562" class="sans stats">11 specialists &#183; 62 fields it already knows &#183; 43 checks that refuse rather than guess</text>
</svg>
